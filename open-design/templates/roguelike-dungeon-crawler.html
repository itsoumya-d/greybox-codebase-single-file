<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roguelike Dungeon Crawler Template</title>
  <style>
    :root { --bg:#11131a; --panel:#1c2030; --fg:#f4ead2; --muted:#a99c85; --accent:#d8a248; --danger:#c84949; --tile:#262c3a; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,sans-serif; }
    main { display:grid; grid-template-columns:minmax(0,240px) minmax(0,1fr) minmax(0,260px); gap:16px; padding:18px; min-height:100vh; }
    section, aside { border:1px solid #343b4f; background:var(--panel); border-radius:8px; padding:14px; min-width:0; }
    h1,h2 { margin:0 0 12px; letter-spacing:.04em; text-transform:uppercase; } .map { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:4px; align-content:center; }
    .tile { aspect-ratio:1; background:var(--tile); border:1px solid #384056; border-radius:3px; display:grid; place-items:center; color:var(--muted); }
    .wall { background:#0b0d12; } .player { background:var(--accent); color:#14120b; } .enemy { background:var(--danger); } .loot { background:#4f7d55; }
    .bar { height:10px; border-radius:999px; background:#10131c; overflow:hidden; margin:6px 0 12px; } .bar span { display:block; height:100%; background:var(--accent); }
    .list { display:grid; gap:8px; } .chip { display:flex; justify-content:space-between; gap:10px; border:1px solid #33394b; border-radius:6px; padding:8px; }
    @media (max-width:840px) { main { grid-template-columns:1fr; padding:12px; } .map { gap:3px; } .tile { font-size:12px; } }
  </style>
</head>
<body>
  <main>
    <aside><h1>Crypt Run</h1><div>Floor 3</div><div class="bar"><span style="width:68%"></span></div><div>Goal: find the sigil key, defeat the warden, descend.</div></aside>
    <section><h2>Dungeon Room</h2><div class="map">
      <div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div>
      <div class="tile wall"></div><div class="tile player">P</div><div class="tile"></div><div class="tile loot">K</div><div class="tile"></div><div class="tile"></div><div class="tile enemy">E</div><div class="tile"></div><div class="tile"></div><div class="tile loot">*</div><div class="tile"></div><div class="tile wall"></div>
      <div class="tile wall"></div><div class="tile"></div><div class="tile"></div><div class="tile wall"></div><div class="tile"></div><div class="tile enemy">S</div><div class="tile"></div><div class="tile"></div><div class="tile wall"></div><div class="tile"></div><div class="tile"></div><div class="tile wall"></div>
      <div class="tile wall"></div><div class="tile"></div><div class="tile loot">+</div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile wall"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile enemy">B</div><div class="tile wall"></div>
      <div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div><div class="tile wall"></div>
    </div></section>
    <aside><h2>Run State</h2><div class="list"><div class="chip"><span>HP</span><b>34 / 50</b></div><div class="chip"><span>Keys</span><b>1</b></div><div class="chip"><span>Threat</span><b>Rising</b></div><div class="chip"><span>Next Reward</span><b>Rare relic</b></div></div></aside>
  </main>
</body>
</html>
