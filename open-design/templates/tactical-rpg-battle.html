<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Tactical RPG Battle Template</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#e9edf2;font:14px/1.4 system-ui,sans-serif}.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;padding:18px;min-height:100vh}.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;background:#18202b;padding:10px;border:1px solid #334156;border-radius:8px;min-width:0;align-content:start}.cell{aspect-ratio:1;border-radius:4px;background:#263445;border:1px solid #35475d;position:relative;min-width:0}.cover{background:#39414a}.hero{background:#2e6f9e}.foe{background:#8a3640}.goal{background:#90722c}.panel{background:#171d27;border:1px solid #334156;border-radius:8px;padding:14px;min-width:0}.unit{display:flex;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #2a3544}.turn{color:#f1c75b;text-transform:uppercase;letter-spacing:.08em}@media (max-width:780px){.wrap{grid-template-columns:1fr;padding:12px}.board{gap:2px;padding:8px}.cell{border-radius:3px}}</style></head>
<body><div class="wrap"><main class="board" aria-label="battle grid">
<div class="cell hero"></div><div class="cell"></div><div class="cell cover"></div><div class="cell"></div><div class="cell"></div><div class="cell goal"></div><div class="cell"></div><div class="cell cover"></div><div class="cell"></div><div class="cell foe"></div>
<div class="cell"></div><div class="cell cover"></div><div class="cell"></div><div class="cell hero"></div><div class="cell"></div><div class="cell"></div><div class="cell foe"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
<div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell cover"></div><div class="cell"></div><div class="cell"></div><div class="cell cover"></div><div class="cell"></div><div class="cell foe"></div><div class="cell"></div>
<div class="cell hero"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell goal"></div><div class="cell"></div><div class="cell"></div><div class="cell cover"></div><div class="cell"></div><div class="cell"></div>
</main><aside class="panel"><h1>Tactical Turn</h1><p class="turn">Player phase: 2 actions left</p><div class="unit"><span>Vera / Vanguard</span><b>22 HP</b></div><div class="unit"><span>Ilo / Hacker</span><b>18 HP</b></div><div class="unit"><span>Marn / Medic</span><b>20 HP</b></div><h2>Objectives</h2><p>Secure both relays before round 6. Optional: no squad member downed.</p></aside></div></body></html>
