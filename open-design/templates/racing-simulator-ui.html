<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Racing Simulator UI Template</title>
<style>
body{margin:0;height:100vh;background:#0a0d12;color:#f4f7fb;font:14px/1.3 system-ui,sans-serif;overflow:hidden}.track{height:100%;position:relative;background:linear-gradient(#1b2535,#0a0d12)}.road{position:absolute;left:20%;right:20%;bottom:0;height:78%;background:#222a32;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.speed{position:absolute;left:28px;bottom:28px;font-size:64px;font-weight:800}.gear{font-size:24px;color:#e8c160}.telemetry{position:absolute;right:28px;bottom:28px;width:260px;background:rgba(8,11,16,.84);border:1px solid #334355;border-radius:8px;padding:12px}.lap{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:28px;background:rgba(8,11,16,.84);border:1px solid #334355;border-radius:8px;padding:12px 18px}.line{display:flex;justify-content:space-between;border-bottom:1px solid #2d3949;padding:6px 0}</style></head>
<body><main class="track"><div class="road"></div><div class="lap"><b>Lap 2 / 5</b><span>Best 1:42.231</span><span>Delta +0.183</span></div><div class="speed">184 <span class="gear">km/h G4</span></div><aside class="telemetry"><div class="line"><span>Tires</span><b>FL 82 / FR 79</b></div><div class="line"><span>Fuel</span><b>11.4 L</b></div><div class="line"><span>Brake temp</span><b>High</b></div><div class="line"><span>Next corner</span><b>Hairpin 120m</b></div></aside></main></body></html>
