<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Horror Survival HUD Template</title>
<style>
body{margin:0;height:100vh;background:#070706;color:#d8d1bd;font:14px/1.35 system-ui,sans-serif;overflow:hidden}.scene{height:100%;position:relative;background:radial-gradient(circle at 50% 46%,#2a2823 0 14%,#070706 58%)}.grain{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}.hud{position:absolute;left:18px;bottom:18px;background:rgba(10,9,8,.82);border:1px solid #3a332b;border-radius:8px;padding:12px;width:260px}.warn{position:absolute;top:18px;right:18px;color:#bc4d3e}.bar{height:9px;background:#171411;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#9b3b35}.prompt{position:absolute;left:50%;bottom:28%;transform:translateX(-50%);border:1px solid #5d5143;background:#11100e;padding:10px 14px;border-radius:6px}</style></head>
<body><main class="scene"><div class="grain"></div><div class="warn">Noise detected behind you</div><div class="prompt">Hold E - barricade door</div><section class="hud"><h1>Basement Hall</h1><p>Health</p><div class="bar"><span style="width:38%"></span></div><p>Ammo: 3 / 12<br>Battery: 19%<br>Inventory: 5 / 8 slots</p></section></main></body></html>
