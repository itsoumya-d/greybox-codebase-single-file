<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>City Builder Overview Template</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17221f;color:#ecf5e9;font:14px/1.4 system-ui,sans-serif}.wrap{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) minmax(0,280px);gap:14px;padding:16px;min-height:100vh}.panel{background:#21312d;border:1px solid #3c554d;border-radius:8px;padding:12px;min-width:0}.city{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}.zone{aspect-ratio:1;border-radius:4px;background:#385244}.road{background:#6a6551}.power{background:#b89042}.water{background:#367b8d}.home{background:#4a7a55}.alert{color:#f0bf59}.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #3c554d;padding:7px 0}@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:12px}.city{grid-template-columns:repeat(6,minmax(0,1fr))}}</style></head>
<body><main class="wrap"><aside class="panel"><h1>Harbor City</h1><div class="stat"><span>Population</span><b>12,480</b></div><div class="stat"><span>Budget</span><b>+420/wk</b></div><div class="stat"><span>Approval</span><b>74%</b></div></aside><section class="panel"><h2>District Grid</h2><div class="city"><div class="zone home"></div><div class="zone road"></div><div class="zone power"></div><div class="zone"></div><div class="zone water"></div><div class="zone road"></div><div class="zone home"></div><div class="zone"></div><div class="zone"></div><div class="zone home"></div><div class="zone road"></div><div class="zone"></div><div class="zone"></div><div class="zone road"></div><div class="zone road"></div><div class="zone home"></div><div class="zone water"></div><div class="zone"></div></div></section><aside class="panel"><h2>Alerts</h2><p class="alert">Power demand exceeds safe load in Old Port.</p><p>Next unlock: ferry terminal at 15k population.</p></aside></main></body></html>
