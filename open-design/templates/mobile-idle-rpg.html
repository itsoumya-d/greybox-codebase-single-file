<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Mobile Idle RPG Template</title>
<style>
body{margin:0;background:#181d2b;color:#f6f2ff;font:14px/1.4 system-ui,sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;background:#222940;padding:14px 14px 76px}.hero{background:#313c61;border:1px solid #4d5d91;border-radius:8px;padding:16px}.party{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.unit,.quest{background:#29334f;border:1px solid #45537d;border-radius:8px;padding:10px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#111622;border-top:1px solid #44506f}.nav button{padding:14px 4px;background:transparent;color:#f6f2ff;border:0}.objective{width:100%;padding:14px;border:0;border-radius:8px;background:#f2b84b;color:#24190a;font-weight:700}</style></head>
<body><main class="phone"><section class="hero"><h1>Starbound Guild</h1><p>Offline rewards ready: 4h 12m</p><button class="objective">Claim and upgrade</button></section><div class="party"><div class="unit">Knight<br><b>Lv 18</b></div><div class="unit">Mage<br><b>Lv 17</b></div><div class="unit">Rogue<br><b>Lv 16</b></div></div><section class="quest"><h2>Auto Battle</h2><p>Wave 42 / 60 - Boss in 3 waves<br>Gold/min: 186 - Shards/min: 7</p></section><section class="quest"><h2>Daily Quests</h2><p>Upgrade gear 2 times<br>Clear tower floor 12<br>Send friend stamina</p></section></main><nav class="nav"><button>Hub</button><button>Team</button><button>Gear</button><button>Quest</button><button>Shop</button></nav></body></html>
