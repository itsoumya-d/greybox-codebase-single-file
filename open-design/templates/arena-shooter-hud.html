<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Arena Shooter HUD Template</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;background:#090b16;color:#f6fbff;font:14px/1.3 system-ui,sans-serif;overflow:hidden}.arena{height:100%;position:relative;background:radial-gradient(circle at center,#1e2550,#080a14 62%)}.score{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:18px;font-size:24px}.hud{position:absolute;bottom:18px;left:18px;right:18px;display:flex;gap:12px;justify-content:space-between;align-items:end}.hud>div:first-child,.hud>div:last-child{min-width:120px}.meter{width:min(220px,28vw);height:14px;background:#151a31;border:1px solid #3c4f92;border-radius:999px;overflow:hidden}.meter span{display:block;height:100%;background:#46dbff}.abilities{display:flex;gap:8px}.ability{width:64px;height:54px;border:1px solid #4d65b5;border-radius:8px;background:#19203e;display:grid;place-items:center}.reticle{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;color:#46dbff}.kill{position:absolute;top:84px;right:18px;background:#141a31;border:1px solid #3c4f92;border-radius:8px;padding:12px}@media (max-width:700px){.score{font-size:20px;gap:12px}.kill{top:70px;right:12px;max-width:calc(100vw - 24px)}.hud{left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr;align-items:stretch}.meter{width:100%}.abilities{justify-content:center}.ability{width:56px;height:48px}}</style></head>
<body><main class="arena"><div class="reticle">+</div><div class="score"><b>48</b><span>03:12</span><b>45</b></div><aside class="kill">You eliminated Rift-7<br>Combo x3</aside><div class="hud"><div><div>Shield 72</div><div class="meter"><span style="width:72%"></span></div></div><div class="abilities"><div class="ability">Dash</div><div class="ability">Mine</div><div class="ability">Ult</div></div><div><div>Ammo 18 / 72</div><div class="meter"><span style="width:40%"></span></div></div></div></main></body></html>
