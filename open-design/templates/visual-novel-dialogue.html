<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Visual Novel Dialogue Template</title>
<style>
body{margin:0;min-height:100vh;background:linear-gradient(#111827,#29344a);color:#fff;font:16px/1.5 Georgia,serif}.scene{min-height:100vh;display:grid;align-items:end;padding:24px}.dialogue{background:rgba(8,12,20,.88);border:1px solid #7181a5;border-radius:8px;padding:18px;max-width:960px;margin:auto}.name{color:#f4c76a;text-transform:uppercase;letter-spacing:.08em}.choices{display:grid;gap:8px;margin-top:14px}.choice{border:1px solid #657796;background:#182237;border-radius:6px;padding:10px}.state{position:absolute;top:18px;right:18px;background:#12192a;border:1px solid #657796;border-radius:8px;padding:10px}</style></head>
<body><main class="scene"><aside class="state">Trust: 42<br>Clue: missing keycard</aside><section class="dialogue"><div class="name">Mira</div><p>The station lights failed two minutes before the captain vanished. If we tell Security now, they seal the docks and our suspect disappears.</p><div class="choices"><div class="choice">Ask Mira what she is hiding.</div><div class="choice">Call Security and risk the lockdown.</div><div class="choice">Use Engineering 2 to restore the camera feed.</div></div></section></main></body></html>
