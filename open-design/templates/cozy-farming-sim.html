<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Cozy Farming Game Template</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3e5bf;color:#3c3121;font:15px/1.45 system-ui,sans-serif}.wrap{padding:18px;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) minmax(0,260px);gap:16px}.card{background:#fff8dc;border:1px solid #d5b778;border-radius:8px;padding:14px;min-width:0}.farm{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}.plot{aspect-ratio:1;border-radius:8px;background:#8b5d35;display:grid;place-items:center;min-width:0;overflow:hidden;text-align:center}.sprout{background:#7eb36a}.water{background:#8fcbd9}.done{background:#e0bd55}.task{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e2ca8b;padding:8px 0}@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:12px}.farm{grid-template-columns:repeat(4,minmax(0,1fr))}.plot{font-size:12px}}</style></head>
<body><main class="wrap"><aside class="card"><h1>Maple Hollow</h1><p>Cozy farming game loop<br>Player energy 62 / 100<br>Weather: light rain</p></aside><section class="card"><h2>Farm Plots</h2><div class="farm"><div class="plot sprout">Carrot</div><div class="plot water">Tea</div><div class="plot"></div><div class="plot done">Berry</div><div class="plot"></div><div class="plot sprout"></div><div class="plot"></div><div class="plot water"></div><div class="plot"></div><div class="plot done"></div><div class="plot sprout"></div><div class="plot"></div><div class="plot water"></div><div class="plot"></div><div class="plot"></div><div class="plot sprout"></div></div></section><aside class="card"><h2>Player Objectives</h2><div class="task"><span>Water tea beds</span><b>3/5</b></div><div class="task"><span>Deliver berries</span><b>0/1</b></div><div class="task"><span>Repair coop</span><b>12 wood</b></div></aside></main></body></html>
